<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fazafizo & Batoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf6f4;
    --ink:#3a1f24;
    --line:#f0d9d9;
    --accent:#8e3b4d;
    --accent-soft:#f7e3e6;
    --good:#a9718a;
    --card:#ffffff;
    --muted:#7d5c62;
    --gold:#c9a24b;
    --gold-text:#7a5c26;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, #fbeaea 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, #fbf1e6 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Lora','Georgia',serif;
    min-height:100vh;
  }
  .utility{font-family:'Karla','Helvetica Neue',Arial,sans-serif;}

  #auth-loading{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .loading-heart{
    width:32px; height:32px;
    fill:none;
    stroke:var(--accent);
    stroke-width:1.6;
    animation:loadingPulse 1.1s ease-in-out infinite;
  }
  @keyframes loadingPulse{
    0%, 100%{opacity:.35; transform:scale(.92);}
    50%{opacity:1; transform:scale(1);}
  }
  #auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 20px 60px -20px rgba(142,59,77,.25);
    padding:44px 36px;
    width:100%;
    max-width:360px;
  }
  .auth-box h1{
    font-family:'Cormorant Garamond',serif;
    font-size:34px;
    font-style:italic;
    margin:0 0 4px;
    font-weight:600;
    color:var(--accent);
  }
  .auth-box p{
    color:var(--muted);
    font-size:14px;
    margin:0 0 24px;
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
  }
  input{
    width:100%;
    padding:11px 14px;
    margin-bottom:12px;
    border:1px solid var(--line);
    border-radius:7px;
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:14px;
    background:#fffdfc;
    color:var(--ink);
    transition:border-color .2s;
  }
  input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  @media (hover:none){
    input, select{font-size:16px;} /* prevents iOS Safari auto-zoom on focus */
  }
  .skeleton-row{
    height:52px;
    border-radius:8px;
    margin-bottom:10px;
    background:linear-gradient(90deg, var(--accent-soft) 25%, #fbeff1 50%, var(--accent-soft) 75%);
    background-size:200% 100%;
    animation:skeletonShimmer 1.4s ease-in-out infinite;
  }
  @keyframes skeletonShimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }
  button{
    cursor:pointer;
    border:none;
    border-radius:7px;
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
  }
  .dash-link, .back-link, .settings-edit, .sheet-more, .claim-offer, .unclaim{
    background:none;
    padding:0;
    font:inherit;
    text-align:left;
  }
  .btn-primary{
    width:100%;
    padding:12px;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .btn-primary:hover{background:#7a2f40;}
  .auth-toggle{
    text-align:center;
    margin-top:14px;
    font-size:13px;
    color:var(--muted);
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
  }
  .auth-toggle a{color:var(--accent); cursor:pointer; text-decoration:underline;}
  .auth-error{
    color:#a4462f;
    font-size:13px;
    margin:-4px 0 12px;
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    min-height:16px;
  }

  #app-screen{display:none;}
  header{
    padding:32px 24px 22px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    max-width:760px;
    margin:0 auto;
  }
  header h1{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:32px;
    margin:0;
    font-weight:600;
    color:var(--accent);
  }
  header .sub{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.1em;
  }
  #signout{
    background:none;
    color:var(--muted);
    font-size:13px;
    text-decoration:underline;
    padding:4px;
  }

  main{max-width:760px; margin:0 auto; padding:24px;}

  #dashboard{
    padding-bottom:26px;
    margin-bottom:26px;
    border-bottom:1px solid var(--line);
  }
  .dash-line{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:22px;
    color:var(--ink);
    margin:0 0 14px;
  }
  .dash-bar{
    width:100%;
    height:6px;
    background:var(--accent-soft);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:10px;
  }
  .dash-bar-fill{
    height:100%;
    background:var(--accent);
    border-radius:20px;
    width:0%;
    transition:width .5s ease;
  }
  .dash-budget{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    color:var(--muted);
    margin:0 0 10px;
  }
  .dash-budget a{color:var(--accent); text-decoration:underline; cursor:pointer;}
  .dash-link{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:14px;
    color:var(--accent);
    cursor:pointer;
    text-decoration:none;
    padding:8px 0;
    margin:-8px 0;
  }
  .dash-link:hover{text-decoration:underline;}
  .dash-links{display:flex; justify-content:space-between;}

  #filters{
    padding-bottom:20px;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .filter-group{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:10px;
  }
  .filter-group:last-of-type{margin-bottom:6px;}
  .filter-label{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--muted);
    flex:0 0 auto;
    width:64px;
  }
  .filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    flex:1;
  }
  .filter-chip{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    padding:7px 12px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#fffdfc;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }
  .filter-chip:hover{border-color:var(--accent);}
  .filter-chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .filter-chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .header-actions{display:flex; align-items:center; gap:14px;}
  #settings-open{
    background:none;
    color:var(--muted);
    font-size:18px;
    padding:4px;
  }
  #settings-open:hover{color:var(--accent);}

  .sub-view{display:none;}
  .sub-view.open{display:block;}
  .back-link{
    display:inline-block;
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    text-decoration:none;
    margin:-8px 0 10px;
    padding:8px 0;
  }
  .back-link:hover{color:var(--accent);}
  .view-title{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:26px;
    color:var(--accent);
    margin:0 0 20px;
    font-weight:600;
  }
  .view-caption{
    font-size:12px;
    color:var(--muted);
    margin-top:20px;
  }

  .recent-day{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--gold-text);
    margin:22px 0 8px;
  }
  .recent-day:first-child{margin-top:0;}
  .recent-entry{
    font-size:15px;
    padding:7px 0;
    border-bottom:1px solid var(--line);
  }

  .settings-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .settings-label{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
    width:120px;
    flex:0 0 auto;
  }
  .settings-value{flex:1; font-size:15px;}
  .settings-edit{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--accent);
    cursor:pointer;
    text-decoration:underline;
    flex:0 0 auto;
    padding:8px 4px;
    margin:-8px -4px;
  }

  #fab{
    position:fixed;
    right:calc(22px + env(safe-area-inset-right));
    bottom:calc(22px + env(safe-area-inset-bottom));
    width:52px; height:52px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:26px;
    line-height:1;
    display:none;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 24px -6px rgba(142,59,77,.45);
    z-index:150;
    transition:transform .15s, background .15s;
  }
  #fab.visible{display:flex;}
  #fab:hover{background:#7a2f40; transform:scale(1.06);}
  #fab:active{transform:scale(.96);}

  .sheet-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(58,31,36,.4);
    z-index:160;
    opacity:0;
    transition:opacity .25s;
  }
  .sheet-overlay.open{display:block; opacity:1;}

  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:520px;
    margin:0 auto;
    background:var(--card);
    border-radius:18px 18px 0 0;
    padding:14px 24px 28px;
    box-shadow:0 -10px 40px -10px rgba(58,31,36,.3);
    transform:translateY(110%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    z-index:170;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{
    width:36px; height:4px;
    background:var(--line);
    border-radius:4px;
    margin:0 auto 14px;
  }
  .sheet-title{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:24px;
    color:var(--accent);
    margin:0 0 2px;
  }
  .sheet-meta{
    font-size:12px;
    color:var(--muted);
    margin:0 0 16px;
  }
  .sheet input, .sheet select{margin-bottom:10px;}
  .sheet-row{display:flex; gap:8px;}
  .sheet-row select{
    flex:1;
    padding:11px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:14px;
    background:#fffdfc;
    margin-bottom:10px;
  }
  .sheet-more{
    display:inline-block;
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    color:var(--accent);
    cursor:pointer;
    text-decoration:none;
    margin:2px 0 16px;
    padding:8px 0;
  }
  .sheet-more:hover{text-decoration:underline;}
  .sheet-more-fields{display:none;}
  .sheet-more-fields.open{display:block;}
  .photo-btn{
    display:inline-block;
    padding:11px 16px;
    border:1px solid var(--line);
    border-radius:7px;
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    color:var(--accent);
    cursor:pointer;
    background:#fffdfc;
    white-space:nowrap;
    margin-bottom:10px;
  }
  .photo-btn.has-file{border-color:var(--good); color:var(--good);}
  .item .thumb{
    width:42px; height:42px;
    border-radius:7px;
    object-fit:cover;
    flex:0 0 auto;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(142,59,77,.2);
  }
  .item .notes{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--muted);
    display:block;
    margin-top:2px;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .item .name-block{flex:1; min-width:0;}
  .item a.link{color:var(--accent);}
  .priority-tag{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:3px 8px;
    border-radius:20px;
    flex:0 0 auto;
  }
  .priority-tag.must{background:#f3d8dc; color:var(--accent);}
  .priority-tag.nice{background:#f6ecd8; color:var(--gold-text);}
  .lightbox{
    display:none;
    position:fixed; inset:0;
    background:rgba(58,31,36,.85);
    align-items:center; justify-content:center;
    z-index:100;
    cursor:zoom-out;
    opacity:0;
    transition:opacity .2s;
  }
  .lightbox.open{display:flex; opacity:1;}
  .lightbox img{max-width:90%; max-height:90%; border-radius:10px;}

  .category{margin-bottom:32px;}
  .category h2{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:19px;
    letter-spacing:.02em;
    color:var(--accent);
    font-weight:600;
    border-bottom:1px solid var(--gold);
    padding-bottom:8px;
    margin:0 0 10px;
    display:flex;
    justify-content:space-between;
    transition:border-color .2s;
  }
  .category h2:hover{border-color:var(--accent);}
  .category h2 .count{
    color:var(--muted);
    font-weight:400;
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-style:normal;
    font-size:12px;
  }

  .item{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
    transition:opacity .3s;
    row-gap:8px;
  }
  .item.bought{opacity:.45;}
  .item.bought .name{text-decoration:line-through;}
  .item-meta{
    display:flex;
    align-items:center;
    gap:12px;
    margin-left:auto;
  }
  @media (max-width:480px){
    .item-meta{
      flex:1 1 100%;
      margin-left:48px;
      justify-content:flex-start;
      flex-wrap:wrap;
      row-gap:6px;
    }
  }
  .check{
    width:36px; height:36px;
    margin:-7px;
    flex:0 0 auto;
    cursor:pointer;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .check svg{width:22px;height:22px; position:absolute; top:7px; left:7px;}
  .check .heart-outline{fill:none; stroke:var(--accent); stroke-width:1.6;}
  .check .heart-fill{fill:var(--accent); stroke:none; display:none;}
  .item.bought .check .heart-outline{display:none;}
  .item.bought .check .heart-fill{display:block;}
  .check.pulse svg{animation:heartPulse .35s ease;}
  @keyframes heartPulse{
    0%{transform:scale(1);}
    40%{transform:scale(1.28);}
    100%{transform:scale(1);}
  }
  .item .name{flex:1; font-size:16px; overflow-wrap:break-word; word-break:break-word;}
  .item .price{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    color:var(--muted);
    flex:0 0 auto;
  }
  .item .by{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    color:var(--accent);
    background:var(--accent-soft);
    padding:3px 9px;
    border-radius:20px;
    flex:0 0 auto;
  }
  .item .del{
    background:none;
    color:var(--muted);
    font-size:16px;
    padding:8px 10px;
    margin:-8px -4px -8px 0;
    flex:0 0 auto;
    transition:color .15s;
  }
  .item .del:hover{color:#a4462f;}
  .claim{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    flex:0 0 auto;
    white-space:nowrap;
    text-align:right;
    line-height:1.4;
    animation:claimFade .25s ease;
  }
  @keyframes claimFade{from{opacity:0;} to{opacity:1;}}
  .claim-offer{
    color:var(--accent);
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
    padding:8px 2px;
    margin:-8px -2px;
  }
  .claim-offer:hover{text-decoration:underline;}
  .claim-mine{color:var(--accent);}
  .claim-mine .unclaim{
    display:block;
    color:var(--muted);
    font-size:10px;
    cursor:pointer;
    text-decoration:underline;
    padding:6px 0 0;
    margin-top:-2px;
  }
  .claim-other{color:var(--muted);}
  .expand-btn{
    background:none;
    color:var(--muted);
    font-size:12px;
    padding:10px 8px;
    margin:-10px -4px;
    flex:0 0 auto;
    transition:transform .2s, color .15s;
  }
  .expand-btn:hover{color:var(--accent);}
  .expand-btn.open{transform:rotate(180deg);}
  .item-wrap{border-bottom:1px solid var(--line);}
  .item-wrap .item{border-bottom:none;}
  .trail{
    display:none;
    padding:2px 4px 14px 46px;
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--muted);
    line-height:1.7;
  }
  .trail.open{display:block;}
  .trail .dot{color:var(--gold);}
  .toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:12px 20px;
    border-radius:8px;
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:200;
    max-width:90%;
    text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .empty{
    text-align:center;
    color:var(--muted);
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:18px;
    padding:50px 0;
  }
  .totals{
    font-family:'Karla','Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    color:var(--muted);
    text-align:right;
    padding:16px 4px 0;
    border-top:1px solid var(--line);
    margin-top:8px;
  }

  @media (max-width:480px){
    .item{flex-wrap:wrap; row-gap:8px;}
    .item .name-block{flex:1 1 100%; order:1;}
    .item .priority-tag,
    .item .price,
    .item .claim,
    .item .by,
    .item .expand-btn,
    .item .del{order:2;}
    .item{justify-content:flex-start;}
    .filter-group{align-items:flex-start; flex-direction:column; gap:6px;}
    .filter-label{width:auto;}
  }
</style>
</head>
<body>

<div id="auth-loading">
  <svg viewBox="0 0 24 24" class="loading-heart"><path d="M12 20.5s-7.5-4.6-10-9.3C.5 7.8 2.3 4.5 5.6 4c2-.3 3.8.6 4.9 2.3C11.6 4.6 13.4 3.7 15.4 4c3.3.5 5.1 3.8 3.6 7.2-2.5 4.7-10 9.3-10 9.3z"/></svg>
</div>

<div id="auth-screen" style="display:none;">
  <div class="auth-box">
    <h1>Fazafizo & Batoot</h1>
    <p class="utility">Everything we're gathering, together. 🦆</p>
    <div class="auth-error utility" id="auth-error"></div>
    <input type="email" id="email" placeholder="Username" aria-label="Email address" autocomplete="email">
    <input type="password" id="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
    <button class="btn-primary" id="auth-submit">Sign in</button>
  </div>
</div>

<div id="app-screen">
  <header>
    <div>
      <h1>Fazafizo & Batoot</h1>
      <div class="sub" id="user-label"></div>
    </div>
    <div class="header-actions">
      <button id="settings-open" aria-label="Settings">⚙</button>
      <button id="signout">Sign out</button>
    </div>
  </header>
  <main>
    <div id="main-view">
      <div id="dashboard">
        <p class="dash-line" id="dash-counts">—</p>
        <div class="dash-bar"><div class="dash-bar-fill" id="dash-bar-fill"></div></div>
        <p class="dash-budget" id="dash-budget">—</p>
        <div class="dash-links">
          <button class="dash-link" id="dash-see-all">See everything ↓</button>
          <button class="dash-link" id="dash-recent">Recent changes →</button>

      <div id="filters">
        <div class="filter-group">
          <span class="filter-label">Category</span>

        <div class="filter-group">
          <span class="filter-label">Status</span>

            <button class="filter-chip" data-filter="status" data-value="bought">Bought</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Priority</span>
          <div class="filter-row">
            <button class="filter-chip active" data-filter="priority" data-value="all">All</button>
            <button class="filter-chip" data-filter="priority" data-value="must">Must</button>
            <button class="filter-chip" data-filter="priority" data-value="nice">Nice</button>

        <button class="dash-link" id="filter-clear" style="display:none;">Clear filters</button>

    <div id="list-container"></div>

    </div>

    <div id="recent-view" class="sub-view">

    <div id="settings-view" class="sub-view">
      <button class="back-link" id="settings-back">← Back</button>
      <h2 class="view-title">Settings</h2>

      <div class="settings-row">
        <span class="settings-label">Household name</span>
        <span class="settings-value" id="settings-name">—</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">Currency</span>
        <span class="settings-value" id="settings-currency">—</span>
        <button class="settings-edit" id="settings-edit-currency">Edit</button>
      </div>
      <div class="settings-row">
        <span class="settings-label">Home budget</span>
        <span class="settings-value" id="settings-budget">—</span>
        <button class="settings-edit" id="settings-edit-budget">Edit</button>
      </div>
      <div class="settings-row">
        <span class="settings-label">Signed in as</span>
        <span class="settings-value" id="settings-user">—</span>
      </div>

      <button class="btn-primary" id="settings-signout" style="margin-top:20px;">Sign out</button>
    </div>
  </main>
</div>

<button id="fab" aria-label="Add item">+</button>

<div class="sheet-overlay" id="sheet-overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h2 class="sheet-title" id="sheet-title">Add something</h2>
  <p class="sheet-meta utility" id="sheet-meta"></p>

  <input type="text" id="item-name" placeholder="Item name" aria-label="Item name">
  <div class="sheet-row">
    <select id="item-category" aria-label="Category">
      <option value="kitchen">🍳 Kitchen</option>
      <option value="living_room">🛋️ Living Room</option>
      <option value="bedroom">🛏️ Bedroom</option>
      <option value="bathroom">🛁 Bathroom</option>
      <option value="furniture">🪑 Furniture</option>
      <option value="appliances">🔌 Appliances</option>
      <option value="decor">🖼️ Decor</option>
      <option value="other">📦 Other</option>
    </select>
    <select id="item-priority" aria-label="Priority">
      <option value="must">Must-have</option>
      <option value="nice">Nice-to-have</option>
    </select>
  </div>
  <input type="number" id="item-price" placeholder="Price" aria-label="Price">

  <button class="sheet-more" id="sheet-more-toggle">+ Add more details</button>

  <div class="sheet-more-fields" id="sheet-more-fields">
    <input type="number" id="item-qty" placeholder="Qty" value="1" min="1" aria-label="Quantity">
    <input type="text" id="item-link" placeholder="Product link (optional)" aria-label="Product link, optional">
    <input type="text" id="item-notes" placeholder="Notes (optional)" aria-label="Notes, optional">
    <label class="photo-btn" for="item-photo" id="item-photo-label">Add photo</label>
    <input type="file" id="item-photo" accept="image/*" style="display:none">
  </div>

  <button class="btn-primary" id="sheet-submit">Add item</button>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()" role="button" tabindex="-1" aria-label="Close enlarged photo">
  <img id="lightbox-img" src="" alt="Item photo, enlarged">
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword,
    onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc,
    doc, serverTimestamp, query, orderBy, getDocs, getDoc, limit
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ==== FILL IN YOUR FIREBASE CONFIG (from Firebase Console > Project Settings) ====
  const firebaseConfig = {
    apiKey: "AIzaSyA01tSumAzD2bltKHKfGuCqihSqUE9brjM",
    authDomain: "the-life-25a38.firebaseapp.com",
    projectId: "the-life-25a38",
    storageBucket: "the-life-25a38.firebasestorage.app",
    messagingSenderId: "149113055887",
    appId: "1:149113055887:web:1a30a9037d89c99a389efa"
  };
  // ===================================================================

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ==== Cloudinary (free image hosting, no card required) ====
  // Sign up at cloudinary.com, find "Cloud name" on your dashboard,
  // then create an unsigned upload preset: Settings > Upload > Add upload preset > Signing Mode: Unsigned
  const CLOUDINARY_CLOUD_NAME = "kz9ilyiy";
  const CLOUDINARY_UPLOAD_PRESET = "jbltarww";

  // ==== Household config ====
  const HOUSEHOLD_ID = "fazafizo-batoot";

  const CATEGORY_LABELS = {
    kitchen: "🍳 Kitchen",
    living_room: "🛋️ Living Room",
    bedroom: "🛏️ Bedroom",
    bathroom: "🛁 Bathroom",
    furniture: "🪑 Furniture",
    appliances: "🔌 Appliances",
    decor: "🖼️ Decor",
    other: "📦 Other"
  };

  // ---- Filters (client-side only, operate on the already-loaded item set) ----
  const filterState = { category: 'all', status: 'all', priority: 'all' };
  let lastItems = [];
  const filterCategoryRow = document.getElementById('filter-category');
  let categoryChipsHtml = '<button class="filter-chip active" data-filter="category" data-value="all">All</button>';
  Object.keys(CATEGORY_LABELS).forEach(catId => {
    categoryChipsHtml += `<button class="filter-chip" data-filter="category" data-value="${catId}">${CATEGORY_LABELS[catId]}</button>`;
  });
  filterCategoryRow.innerHTML = categoryChipsHtml;

  function setFilterChipState() {
    document.querySelectorAll('.filter-chip').forEach(chip => {
      const key = chip.dataset.filter;
      const isActive = chip.dataset.value === filterState[key];
      chip.classList.toggle('active', isActive);
      chip.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
    const anyActive = filterState.category !== 'all' || filterState.status !== 'all' || filterState.priority !== 'all';
    document.getElementById('filter-clear').style.display = anyActive ? 'inline-block' : 'none';
  }
  setFilterChipState();

  document.getElementById('filters').addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (chip) {
      filterState[chip.dataset.filter] = chip.dataset.value;
      setFilterChipState();
      render(lastItems);
      return;
    }
  });

  document.getElementById('filter-clear').onclick = () => {
    filterState.category = 'all';
    filterState.status = 'all';
    filterState.priority = 'all';
    setFilterChipState();
    render(lastItems);
  };

  window.clearFilters = () => {
    filterState.category = 'all';
    filterState.status = 'all';
    filterState.priority = 'all';
    setFilterChipState();
    render(lastItems);
  };

  let members = {};      // uid -> displayName
  let householdCurrency = "";
  let householdBudget = null;

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 3000);
  }

  // ---- Auth UI (sign-in only — accounts are created in the Firebase Console) ----
  const authError = document.getElementById('auth-error');
  const submitBtn = document.getElementById('auth-submit');

  submitBtn.onclick = async () => {
    if (submitBtn.disabled) return;
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    authError.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      authError.textContent = e.message.replace('Firebase: ', '');
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in';
  };

  document.getElementById('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitBtn.click();
  });

  document.getElementById('signout').onclick = () => signOut(auth);

  onAuthStateChanged(auth, async (user) => {
    document.getElementById('auth-loading').style.display = 'none';
    if (user) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      document.getElementById('fab').classList.add('visible');

      try {
        const membersSnap = await getDocs(collection(db, 'households', HOUSEHOLD_ID, 'members'));
        members = {};
        membersSnap.forEach(d => { members[d.id] = d.data().displayName || 'Someone'; });

        const householdSnap = await getDoc(doc(db, 'households', HOUSEHOLD_ID));
        const hData = householdSnap.exists() ? householdSnap.data() : {};
        householdCurrency = hData.currency || '';
        householdBudget = typeof hData.budget === 'number' ? hData.budget : null;

        document.getElementById('user-label').textContent =
          `Welcome back, ${members[user.uid] || user.email.split('@')[0]} 🦆`;
      } catch (e) {
        toast('Could not load household info: ' + e.message);
      }

      startListener();
    } else {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-screen').style.display = 'none';
      document.getElementById('fab').classList.remove('visible');
      if (unsub) { unsub(); unsub = null; }
      members = {};
      householdCurrency = '';
      householdBudget = null;
    }
  });

  // ---- Firestore list ----
  const itemsRef = collection(db, 'households', HOUSEHOLD_ID, 'items');
  const activityRef = collection(db, 'households', HOUSEHOLD_ID, 'activity');

  async function logActivity(type, itemName) {
    try {
      await addDoc(activityRef, {
        type, itemName,
        byUid: auth.currentUser.uid,
        timestamp: serverTimestamp()
      });
    } catch (e) {
      // Non-critical — the item action already succeeded, don't surface this to the user.
      console.warn('Activity log failed:', e.message);
    }
  }
  let unsub = null;

  function startListener() {
    if (unsub) return;
    document.getElementById('list-container').innerHTML =
      '<div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>';
    const q = query(itemsRef, orderBy('createdAt', 'desc'));
    unsub = onSnapshot(q, (snap) => {
      const items = [];
      snap.forEach(d => items.push({ id: d.id, ...d.data() }));
      lastItems = items;
      render(items);
    }, (err) => {
      document.getElementById('list-container').innerHTML =
        '<div class="empty">Something\'s out of sync — try refreshing.</div>';
    });
  }

  // ---- Add/Edit sheet ----
  const fab = document.getElementById('fab');
  const sheetOverlay = document.getElementById('sheet-overlay');
  const sheet = document.getElementById('sheet');
  const sheetTitle = document.getElementById('sheet-title');
  const sheetMeta = document.getElementById('sheet-meta');
  const sheetSubmit = document.getElementById('sheet-submit');
  const moreToggle = document.getElementById('sheet-more-toggle');
  const moreFields = document.getElementById('sheet-more-fields');

  const nameInput = document.getElementById('item-name');
  const categoryInput = document.getElementById('item-category');
  const priorityInput = document.getElementById('item-priority');
  const priceInput = document.getElementById('item-price');
  const qtyInput = document.getElementById('item-qty');
  const linkInput = document.getElementById('item-link');
  const notesInput = document.getElementById('item-notes');
  const photoInput = document.getElementById('item-photo');
  const photoLabel = document.getElementById('item-photo-label');

  let editingId = null;

  photoInput.onchange = () => {
    photoLabel.textContent = photoInput.files[0] ? photoInput.files[0].name.slice(0, 14) : 'Add photo';
    photoLabel.classList.toggle('has-file', !!photoInput.files[0]);
  };

  moreToggle.onclick = () => {
    moreFields.classList.toggle('open');
    moreToggle.textContent = moreFields.classList.contains('open') ? '– Less details' : '+ Add more details';
  };

  function resetSheetFields() {
    nameInput.value = '';
    categoryInput.value = 'kitchen';
    priorityInput.value = 'must';
    priceInput.value = '';
    qtyInput.value = '1';
    linkInput.value = '';
    notesInput.value = '';
    photoInput.value = '';
    photoLabel.textContent = 'Add photo';
    photoLabel.classList.remove('has-file');
    moreFields.classList.remove('open');
    moreToggle.textContent = '+ Add more details';
  }

  function openSheet() {
    sheetOverlay.classList.add('open');
    sheet.classList.add('open');
    setTimeout(() => nameInput.focus(), 50);
  }
  function hasUnsavedInput() {
    return nameInput.value.trim() || priceInput.value || linkInput.value.trim() || notesInput.value.trim();
  }
  function closeSheet() {
    if (hasUnsavedInput() && !confirm('Discard this item?')) return;
    sheetOverlay.classList.remove('open');
    sheet.classList.remove('open');
    editingId = null;
    resetSheetFields();
  }

  window.openAddSheet = () => {
    editingId = null;
    resetSheetFields();
    sheetTitle.textContent = 'Add something';
    sheetMeta.textContent = '';
    sheetSubmit.textContent = 'Add item';
    openSheet();
  };

  window.openEditSheet = (id, data) => {
    editingId = id;
    nameInput.value = data.name || '';
    categoryInput.value = data.categoryId || 'kitchen';
    priorityInput.value = data.priority || 'must';
    priceInput.value = (typeof data.price === 'number') ? data.price : '';
    qtyInput.value = data.quantity || 1;
    linkInput.value = data.link || '';
    notesInput.value = data.notes || '';
    photoInput.value = '';
    photoLabel.textContent = data.photoURL ? 'Photo attached — pick to replace' : 'Add photo';
    photoLabel.classList.toggle('has-file', !!data.photoURL);
    if (data.link || data.notes || (data.quantity && data.quantity !== 1) || data.photoURL) {
      moreFields.classList.add('open');
      moreToggle.textContent = '– Less details';
    } else {
      moreFields.classList.remove('open');
      moreToggle.textContent = '+ Add more details';
    }
    sheetTitle.textContent = 'Edit item';
    const addedByName = members[data.addedBy] || 'Someone';
    const addedDate = formatDate(data.createdAt);
    sheetMeta.textContent = `Added by ${addedByName}${addedDate ? ' on ' + addedDate : ''}`;
    sheetSubmit.textContent = 'Save changes';
    openSheet();
  };

  fab.onclick = () => window.openAddSheet();
  sheetOverlay.onclick = closeSheet;

  sheetSubmit.onclick = async () => {
    const name = nameInput.value.trim();
    const categoryId = categoryInput.value;
    const priority = priorityInput.value;
    const price = parseFloat(priceInput.value) || 0;
    const quantity = parseInt(qtyInput.value) || 1;
    if (price < 0 || quantity < 1) {
      toast('Price and quantity can\'t be negative');
      return;
    }
    const link = linkInput.value.trim();
    const notes = notesInput.value.trim();
    const file = photoInput.files[0];
    if (!name) { toast('Give it a name first'); return; }
    if (file && file.size > 10 * 1024 * 1024) {
      toast("That photo's too large (max 10MB) — try a smaller one, or save without it.");
      return;
    }

    sheetSubmit.disabled = true;
    sheetSubmit.textContent = editingId ? 'Saving...' : 'Adding...';

    try {
      let photoURL;
      if (file) {
        try {
          const formData = new FormData();
          formData.append('file', file);
          formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || 'Upload failed');
          photoURL = data.secure_url;
        } catch (photoErr) {
          toast("That photo didn't upload — saving the item without it.");
        }
      }

      if (editingId) {
        const updateData = { name, categoryId, priority, price, quantity, link, notes, updatedAt: serverTimestamp() };
        if (photoURL) updateData.photoURL = photoURL;
        await updateDoc(doc(db, 'households', HOUSEHOLD_ID, 'items', editingId), updateData);
        logActivity('edited', name);
        toast('Saved');
      } else {
        await addDoc(itemsRef, {
          name, categoryId, priority, price, quantity, link, notes,
          photoURL: photoURL || '',
          status: 'needed',
          addedBy: auth.currentUser.uid,
          claimedBy: null,
          purchasedBy: null,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          purchasedAt: null
        });
        logActivity('added', name);
        toast('Added to the list');
      }

      editingId = null;
      resetSheetFields();
      sheetOverlay.classList.remove('open');
      sheet.classList.remove('open');
    } catch (e) {
      toast(editingId ? 'Could not save changes' : 'Could not add item');
    }

    sheetSubmit.disabled = false;
    sheetSubmit.textContent = editingId ? 'Save changes' : 'Add item';
  };

  const pendingActions = new Set();

  window.toggleItem = async (id, current, el) => {
    const key = 'toggle:' + id;
    if (pendingActions.has(key)) return;
    pendingActions.add(key);
    const nowBought = current !== 'bought';
    if (el) { el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 350); }
    try {
      await updateDoc(doc(db, 'households', HOUSEHOLD_ID, 'items', id), {
        status: nowBought ? 'bought' : 'needed',
        purchasedBy: nowBought ? auth.currentUser.uid : null,
        purchasedAt: nowBought ? serverTimestamp() : null,
        updatedAt: serverTimestamp()
      });
      const itemName = (window.itemsById[id] || {}).name || 'item';
      logActivity(nowBought ? 'purchased' : 'unpurchased', itemName);
      toast(nowBought ? 'Marked as bought' : 'Marked as still needed');
    } catch (e) {
      toast('Could not update item — check your connection and try again.');
    }
    pendingActions.delete(key);
  };
  window.claimItem = async (id, current) => {
    const key = 'claim:' + id;
    if (pendingActions.has(key)) return;
    pendingActions.add(key);
    const uid = auth.currentUser.uid;
    const newClaim = current === uid ? null : uid;
    try {
      await updateDoc(doc(db, 'households', HOUSEHOLD_ID, 'items', id), {
        claimedBy: newClaim,
        updatedAt: serverTimestamp()
      });
    } catch (e) {
      toast('Could not update claim — check your connection and try again.');
    }
    pendingActions.delete(key);
  };
  window.deleteItem = async (id) => {
    const name = (window.itemsById[id] || {}).name || 'this item';
    if (!confirm(`Remove "${name}" from the list?`)) return;
    try {
      await deleteDoc(doc(db, 'households', HOUSEHOLD_ID, 'items', id));
      logActivity('deleted', name);
      toast('Removed');
    } catch (e) {
      toast('Could not remove item — check your connection and try again.');
    }
  };
  window.openLightbox = (url) => {
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox').classList.add('open');
  };
  window.closeLightbox = () => {
    document.getElementById('lightbox').classList.remove('open');
  };
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('lightbox').classList.contains('open')) { closeLightbox(); return; }
    if (sheet.classList.contains('open')) closeSheet();
  });

  const expandedItems = new Set();
  window.toggleTrail = (id) => {
    if (expandedItems.has(id)) expandedItems.delete(id);
    else expandedItems.add(id);
    const btn = document.querySelector(`.expand-btn[data-id="${id}"]`);
    const trail = document.querySelector(`.trail[data-id="${id}"]`);
    if (btn) btn.classList.toggle('open');
    if (trail) trail.classList.toggle('open');
  };

  function formatDate(ts) {
    if (!ts || !ts.toDate) return null;
    return ts.toDate().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderDashboard(items) {
    const total = items.length;
    const bought = items.filter(it => it.status === 'bought').length;
    document.getElementById('dash-counts').textContent =
      total === 0 ? "Nothing planned yet" : `${total} thing${total === 1 ? '' : 's'} planned · ${bought} already bought`;

    const currency = householdCurrency || '';
    const purchasedAmount = items.reduce((sum, it) => {
      if (it.status !== 'bought') return sum;
      return sum + (it.price || 0) * (it.quantity || 1);
    }, 0);

    const budgetEl = document.getElementById('dash-budget');
    const fillEl = document.getElementById('dash-bar-fill');

    if (householdBudget && householdBudget > 0) {
      const remaining = householdBudget - purchasedAmount;
      const pct = Math.min(100, (purchasedAmount / householdBudget) * 100);
      fillEl.style.width = pct + '%';
      budgetEl.textContent =
        `${purchasedAmount.toFixed(2)} ${currency} spent · ${remaining.toFixed(2)} ${currency} remaining of ${householdBudget.toFixed(2)} ${currency}`;
    } else {
      fillEl.style.width = total === 0 ? '0%' : `${Math.min(100, (bought / total) * 100)}%`;
      budgetEl.innerHTML = `${purchasedAmount.toFixed(2)} ${currency} spent so far — set a budget in Firestore to track it here`;
    }
  }

  document.getElementById('dash-see-all').onclick = () => {
    document.getElementById('list-container').scrollIntoView({ behavior: 'smooth' });
  };

  // ---- View switching (main / recent / settings) ----
  function showView(id) {
    document.getElementById('main-view').classList.remove('open');
    document.getElementById('recent-view').classList.remove('open');
    document.getElementById('settings-view').classList.remove('open');
    if (id === 'main') {
      document.getElementById('main-view').style.display = 'block';
      document.getElementById('recent-view').classList.remove('open');
      document.getElementById('settings-view').classList.remove('open');
    } else {
      document.getElementById('main-view').style.display = 'none';
      document.getElementById(id).classList.add('open');
    }
  }
  document.getElementById('main-view').style.display = 'block';

  document.getElementById('dash-recent').onclick = () => {
    renderRecentChanges();
    showView('recent-view');
  };
  document.getElementById('recent-back').onclick = () => showView('main');
  document.getElementById('settings-open').onclick = () => {
    renderSettings();
    showView('settings-view');
  };
  document.getElementById('settings-back').onclick = () => showView('main');

  function dayLabel(date) {
    const now = new Date();
    const d = new Date(date);
    const diffDays = Math.floor((now.setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0)) / 86400000);
    if (diffDays === 0) return 'Today';
    if (diffDays === 1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  const ACTIVITY_VERBS = {
    added: (name) => `added "${name}"`,
    edited: (name) => `edited "${name}"`,
    purchased: (name) => `marked "${name}" as bought`,
    unpurchased: (name) => `marked "${name}" as not bought`,
    deleted: (name) => `removed "${name}"`
  };

  async function renderRecentChanges() {
    const container = document.getElementById('recent-list');
    container.innerHTML = '<div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>';

    let snap;
    try {
      snap = await getDocs(query(activityRef, orderBy('timestamp', 'desc'), limit(40)));
    } catch (e) {
      container.innerHTML = '<div class="empty">Couldn\'t load recent activity right now.</div>';
      return;
    }

    if (snap.empty) {
      container.innerHTML = '<div class="empty">No activity yet — once you two start adding things, it\'ll show up here.</div>';
      return;
    }

    let html = '';
    let lastLabel = null;
    snap.forEach(d => {
      const e = d.data();
      if (!e.timestamp || !e.timestamp.toDate) return;
      const date = e.timestamp.toDate();
      const label = dayLabel(date);
      if (label !== lastLabel) {
        html += `<div class="recent-day">${label}</div>`;
        lastLabel = label;
      }
      const verb = ACTIVITY_VERBS[e.type];
      if (!verb) return;
      const byName = members[e.byUid] || 'Someone';
      html += `<div class="recent-entry">${escapeHtml(byName)} ${verb(escapeHtml(e.itemName || 'an item'))}</div>`;
    });
    container.innerHTML = html || '<div class="empty">No activity yet.</div>';
  }

  // ---- Settings ----
  function renderSettings() {
    document.getElementById('settings-name').textContent = 'Fazafizo & Batoot';
    document.getElementById('settings-currency').textContent = householdCurrency || '—';
    document.getElementById('settings-budget').textContent =
      householdBudget ? `${householdBudget.toFixed(2)} ${householdCurrency}` : 'Not set';
    document.getElementById('settings-user').textContent =
      `${members[auth.currentUser.uid] || 'You'} (${auth.currentUser.email})`;
  }

  document.getElementById('settings-edit-currency').onclick = async () => {
    const val = prompt('Currency code (e.g. EGP, USD):', householdCurrency || '');
    if (val === null || !val.trim()) return;
    try {
      await updateDoc(doc(db, 'households', HOUSEHOLD_ID), { currency: val.trim().toUpperCase() });
      householdCurrency = val.trim().toUpperCase();
      renderSettings();
      toast('Currency updated');
    } catch (e) {
      toast('Could not update currency');
    }
  };

  document.getElementById('settings-edit-budget').onclick = async () => {
    const val = prompt('Home budget:', householdBudget || '');
    if (val === null) return;
    const num = parseFloat(val);
    if (isNaN(num) || num < 0) { toast('Enter a valid number'); return; }
    try {
      await updateDoc(doc(db, 'households', HOUSEHOLD_ID), { budget: num });
      householdBudget = num;
      renderSettings();
      renderDashboard(Object.values(window.itemsById));
      toast('Budget updated');
    } catch (e) {
      toast('Could not update budget');
    }
  };

  document.getElementById('settings-signout').onclick = () => signOut(auth);

  window.itemsById = {};

  function render(items) {
    window.itemsById = {};
    items.forEach(it => { window.itemsById[it.id] = it; });
    renderDashboard(items);
    const container = document.getElementById('list-container');
    const totalsEl = document.getElementById('totals');
    if (items.length === 0) {
      container.innerHTML = '<div class="empty">No items yet — add the first thing you need.</div>';
      totalsEl.textContent = '';
      return;
    }

    const filteredItems = items.filter(it => {
      if (filterState.category !== 'all' && (it.categoryId || 'other') !== filterState.category) return false;
      if (filterState.status !== 'all' && it.status !== filterState.status) return false;
      if (filterState.priority !== 'all' && it.priority !== filterState.priority) return false;
      return true;
    });

    if (filteredItems.length === 0) {
      container.innerHTML = '<div class="empty">Nothing matches these filters.<br><button class="dash-link" style="display:inline-block; margin-top:10px;" onclick="clearFilters()">Clear filters</button></div>';
      totalsEl.textContent = '';
      return;
    }

    const byCategory = {};
    filteredItems.forEach(it => {
      const cat = it.categoryId || 'other';
      (byCategory[cat] = byCategory[cat] || []).push(it);
    });

    const myUid = auth.currentUser.uid;
    const currency = householdCurrency || '';

    let html = '';
    let totalAll = 0, totalBought = 0;
    for (const catId of Object.keys(byCategory)) {
      const list = byCategory[catId];
      const label = CATEGORY_LABELS[catId] || CATEGORY_LABELS.other;
      html += `<div class="category"><h2>${label} <span class="count">${list.length}</span></h2>`;
      list.forEach(it => {
        const qty = it.quantity || 1;
        const lineTotal = (it.price || 0) * qty;
        totalAll += lineTotal;
        if (it.status === 'bought') totalBought += lineTotal;
        const isMust = (it.priority || 'must') === 'must';
        const addedByName = members[it.addedBy] || 'Someone';
        const claimedByName = it.claimedBy ? (members[it.claimedBy] || 'Someone') : null;
        const isClaimedByMe = it.claimedBy === myUid;
        const purchasedByName = it.purchasedBy ? (members[it.purchasedBy] || 'Someone') : null;
        const addedDate = formatDate(it.createdAt);
        const purchasedDate = formatDate(it.purchasedAt);
        const isOpen = expandedItems.has(it.id);
        html += `
          <div class="item-wrap">
          <div class="item ${it.status === 'bought' ? 'bought' : ''}">
            <div class="check" onclick="toggleItem('${it.id}','${it.status}', this)" role="button" tabindex="0" aria-label="${it.status === 'bought' ? 'Mark as still needed' : 'Mark as bought'}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleItem('${it.id}','${it.status}', this)}">
              <svg class="heart-outline" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-10-9.3C.5 7.8 2.3 4.5 5.6 4c2-.3 3.8.6 4.9 2.3C11.6 4.6 13.4 3.7 15.4 4c3.3.5 5.1 3.8 3.6 7.2-2.5 4.7-10 9.3-10 9.3z"/></svg>
              <svg class="heart-fill" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-10-9.3C.5 7.8 2.3 4.5 5.6 4c2-.3 3.8.6 4.9 2.3C11.6 4.6 13.4 3.7 15.4 4c3.3.5 5.1 3.8 3.6 7.2-2.5 4.7-10 9.3-10 9.3z"/></svg>
            </div>
            ${it.photoURL ? `<img class="thumb" src="${it.photoURL}" alt="${escapeHtml(it.name)}" onclick="openLightbox('${it.photoURL}')">` : ''}
            <div class="name-block">
              <div class="name">${escapeHtml(it.name)}${qty > 1 ? ` ×${qty}` : ''} ${safeHref(it.link) ? `<a class="link utility" href="${escapeHtml(safeHref(it.link))}" target="_blank" rel="noopener">↗</a>` : ''}</div>
              ${it.notes ? `<span class="notes">${escapeHtml(it.notes)}</span>` : ''}
            </div>
            <div class="item-meta">
              <span class="priority-tag ${isMust ? 'must' : 'nice'}">${isMust ? 'Must' : 'Nice'}</span>
              ${it.price ? `<div class="price">${lineTotal.toFixed(2)} ${escapeHtml(currency)}</div>` : ''}
              ${it.status !== 'bought' ? (
                !it.claimedBy
                  ? `<button class="claim claim-offer" onclick="claimItem('${it.id}','')">I'll get this</button>`
                  : isClaimedByMe
                    ? `<span class="claim claim-mine">You're getting this<button class="unclaim" onclick="claimItem('${it.id}','${it.claimedBy}')">Unclaim</button></span>`
                    : `<span class="claim claim-other">${escapeHtml(claimedByName)} is getting this</span>`
              ) : ''}
              <div class="by">${escapeHtml(addedByName)}</div>
              <button class="expand-btn ${isOpen ? 'open' : ''}" data-id="${it.id}" onclick="toggleTrail('${it.id}')" aria-label="${isOpen ? 'Hide' : 'Show'} details">▾</button>
              <button class="del" onclick="deleteItem('${it.id}')" aria-label="Delete ${escapeHtml(it.name)}">×</button>
            </div>
          </div>
          <div class="trail ${isOpen ? 'open' : ''}" data-id="${it.id}">
            <span class="dot">●</span> Added by ${escapeHtml(addedByName)}${addedDate ? ` on ${addedDate}` : ''}<br>
            ${it.claimedBy ? `<span class="dot">●</span> Claimed by ${escapeHtml(claimedByName)}<br>` : ''}
            ${it.status === 'bought' ? `<span class="dot">●</span> Bought by ${escapeHtml(purchasedByName)}${purchasedDate ? ` on ${purchasedDate}` : ''}` : `<span class="dot">●</span> Still needed`}
            <br><button class="sheet-more" style="margin-top:8px;" onclick="openEditSheet('${it.id}', itemsById['${it.id}'])">Edit</button>
          </div>
          </div>`;
      });
      html += `</div>`;
    }
    container.innerHTML = html;
    totalsEl.textContent = `Bought ${totalBought.toFixed(2)} of ${totalAll.toFixed(2)} ${currency} total`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function safeHref(url) {
    if (!url) return null;
    const trimmed = url.trim();
    if (/^https?:\/\//i.test(trimmed)) return trimmed;
    return null;
  }
</script>
</body>
</html>
